name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 固定镜像标签：ubuntu-latest 自 2026-10 起迁往 Ubuntu 26。CI 是唯一验证入口，
    # 让它能被镜像升级悄悄改红/改绿，等于放弃「本地能过 = CI 能过」的可复现性。
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Robolectric 的 android-all 运行时（约 150MB）默认下载到 ~/.m2，不在 Gradle 缓存内；
      # 不缓存会导致每次 CI 都重新拉取。
      - name: Cache Robolectric runtime
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-4.16

      # 凭据入库兜底：仓库曾把 GitHub PAT 写进 remote URL，一旦同样的手法写进代码/脚本/文档
      # 就会跟着 fork 与 PR 一起扩散。这里只扫工作区（git 历史由 gitleaks 一类工具负责），
      # 零依赖、秒级返回，放在最前面失败最快。
      # 白名单说明：keystore.properties / keystore.key 是测试专用签名材料，有意入库，不匹配本规则。
      - name: Scan for credentials
        run: |
          if grep -rInE "gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----" \
              --exclude-dir=.git --exclude-dir=.gradle --exclude-dir=build --exclude-dir=.idea . ; then
            echo "::error::发现疑似凭据，请从文件与 remote URL 中移除后再提交"
            exit 1
          fi

      - name: Architecture guards and unit tests
        run: >
          ./gradlew
          verifyModuleDependencies
          verifyComposeStabilityConfig
          testDebugUnitTest
          --stacktrace

      # AGP 9 已移除内置覆盖率任务，覆盖率由 build-logic 里的 JaCoCo 配置提供，
      # 报告落在各模块 build/reports/jacoco/unitTestCoverageReport/。
      - name: Unit test coverage report
        run: ./gradlew unitTestCoverageReport --stacktrace

      # 门槛按"逻辑层"口径：Compose UI 与生成类已在 classDirectories 中排除。
      # feature 逻辑层 50%、core:data-repository 65%、core:domain 82%、core:network 28%
      # （2026-10-27 按实测水平重校，含 core:network 首次纳入；定标规则见 build.gradle.kts）。
      - name: Unit test coverage gates
        run: ./gradlew verifyUnitTestCoverage --stacktrace

      # lint 策略集中在 build-logic 约定插件（Lint.configureFragmjectLint），不使用 baseline；
      # 此处负责真正执行，避免"配置了但没人跑"。
      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      # detekt 由根项目统一扫描各模块 main 源码，不使用 baseline：任何新增违规直接阻断。
      - name: detekt static analysis
        run: ./gradlew detekt --stacktrace

      # 单测不覆盖资源合并、R8、NDK 编译与签名，打包链路必须单独验证。
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            build/reports/problems/
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: '**/build/reports/jacoco/**'
          if-no-files-found: ignore

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
            **/build/reports/lint-results-*.txt
          if-no-files-found: ignore

      - name: Upload detekt reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: detekt-reports
          path: build/reports/detekt/
          if-no-files-found: ignore

name: Instrumented Tests

# 为什么单独一个 workflow：
# 1. instrumentation 测试要跑模拟器，单轮 15~25 分钟，放进 PR 流水线会拖慢每次提交；
# 2. 模拟器上的稳定性受宿主机与镜像影响，先以「每周 + 手动」跑，观察一段时间稳定后再
#    决定是否提到 pull_request 上。
on:
  workflow_dispatch:
  schedule:
    # 每周一 02:00（UTC+8）跑一次：DB 迁移与 Keystore 这类测试长期不跑会静默腐烂
    - cron: "0 18 * * 0"

permissions:
  contents: read

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    # 固定镜像标签：ubuntu-latest 自 2026-10 起迁往 Ubuntu 26，跑模拟器时内核 / KVM / GPU
    # 差异会直接表现为「昨天还绿、今天全红」，固定版本可让每周任务不随镜像漂移。
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # GitHub 的 Linux runner 默认拿不到 /dev/kvm 权限，不放开会退化成纯软件模拟，
      # 一轮测试能跑上 40 分钟。
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 显式列出要跑的三个模块，**不要**用根级 `connectedDebugAndroidTest`：
      # 根级会把 :benchmark 一并展开（com.android.test + experimentalProperties.self-instrumenting
      # + targetProjectPath=:app），宏基准与 Baseline Profile 在 CI 模拟器上既慢又不可归因，
      # 失败信息只有 "The process '/usr/bin/sh' failed with exit code 1"，看不出是哪个测试挂的。
      #
      # --continue：单模块失败后继续跑其余模块，一次 CI 拿全部失败项，避免「修一个冒一个」。
      # logcat：报告只写断言结果，崩溃 / ANR / 权限 / 时序问题必须看 logcat；模拟器销毁前抓一份。
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          # 坑：android-emulator-runner 会把整块 script 压成一行再交给 sh，
          # 因此这里必须写成「单行 + 分号」，不能用反斜杠续行，也不能依赖多行独立执行。
          # 反斜杠续行会被当成独立参数传给 Gradle，报
          # "Task '\' not found in root project"（已踩过：run 40465548591，模拟器启动成功后卡在参数解析，
          # 连带 logcat.txt 也没生成）。
          # 用 if/else 而不是 `cmd; rc=$?`：若 shell 带 set -e，失败后会在取 $? 之前就退出。
          script: >-
            if ./gradlew :core:database:connectedDebugAndroidTest :core:android-platform:connectedDebugAndroidTest :feature:home:impl:connectedDebugAndroidTest --stacktrace --continue; then rc=0; else rc=1; fi; adb logcat -d -v threadtime > logcat.txt 2>/dev/null || true; exit $rc

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            logcat.txt

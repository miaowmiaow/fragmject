name: Weekly Release Build

# 目的：持续验证 release 打包链路（R8 收缩、资源收缩、native、签名），
# 避免长期不构建导致升级 AGP/R8 后才暴露问题。
# 单测与 lint 由 ci.yml 负责，这里只证明"能出可安装的 release 包 + 有 mapping"。

on:
  schedule:
    # 每周一 04:00（北京时间）执行；UTC 20:00 周日
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-weekly
  cancel-in-progress: true

jobs:
  release:
    # 与 ci.yml / instrumented-tests.yml 保持一致：固定镜像，避免标签迁移带来的环境漂移。
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # 仓库内的 keystore.properties / keystore.key 为测试专用签名，已入库（有意为之）。
      - name: Resolve version name
        id: version
        run: echo "name=$(grep -E '^versionName=' config.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: release-apk-${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: error

      # R8 mapping 必须与 APK 同版本归档：线上崩溃栈只有配合它才能还原。
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v5
        with:
          name: r8-mapping-${{ steps.version.outputs.name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: error

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: release-build-reports
          path: |
            **/build/reports/
          if-no-files-found: ignore

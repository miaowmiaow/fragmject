name: Weekly Release Build

# 目的：持续验证 release 打包链路（R8 收缩、资源收缩、native、签名），
# 避免长期不构建导致升级 AGP/R8 后才暴露问题。
# 单测与 lint 由 ci.yml 负责，这里只证明"能出可安装的 release 包 + 有 mapping"。

on:
  schedule:
    # 每周一 04:00（北京时间）执行；UTC 20:00 周日
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-weekly
  cancel-in-progress: true

jobs:
  release:
    # 与 ci.yml / instrumented-tests.yml 保持一致：固定镜像，避免标签迁移带来的环境漂移。
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # 仓库内的 keystore.properties / keystore.key 为测试专用签名，已入库（有意为之）。
      - name: Resolve version name
        id: version
        run: echo "name=$(grep -E '^versionName=' config.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # 加固开关必须在这里显式打开：默认关闭是为了不影响本地调试构建，
      # 但发布产物必须带上字符串加密（H2）、资源混淆（H4）与 DEX 壳（H6）。
      # 三者可叠加：资源混淆与打壳在构建图里已串行（resobf → shell）。
      - name: Assemble release APK (hardened)
        run: |
          ./gradlew :app:assembleRelease \
            -PenableStringFog=true \
            -PenableResObf=true \
            -PenableDexShell=true \
            --stacktrace

      # 开壳后**只有 app-release-shell.apk 可发布**：
      # app-release.apk / app-release-resobf.apk 的 manifest 已指向 StubApplication，
      # 但里面没有壳 dex，装上必然启动即崩。这里先做结构与签名校验。
      - name: Verify hardened APK
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release-shell.apk
          test -f "$APK"

          # 清单只导出一次：`unzip -l | grep -q` 在 pipefail 下会因 SIGPIPE 返回 141
          # （grep 提前退出导致 unzip 被中断），造成假失败。实测踩到。
          unzip -l "$APK" > "$RUNNER_TEMP/apk-listing.txt"

          # 1) 结构：业务 dex 必须已被抽走（只剩 10KB 级壳 dex），并存在加密载荷
          grep -qE "assets/payload/dex-0\.bin" "$RUNNER_TEMP/apk-listing.txt"
          grep -qE "assets/payload/sum\.txt" "$RUNNER_TEMP/apk-listing.txt"
          ! grep -q "classes2.dex" "$RUNNER_TEMP/apk-listing.txt" || { echo "业务 dex 未被抽走"; exit 1; }
          DEX_SIZE=$(awk '$4=="classes.dex"{print $1}' "$RUNNER_TEMP/apk-listing.txt")
          test -n "$DEX_SIZE" || { echo "找不到 classes.dex"; exit 1; }
          test "$DEX_SIZE" -lt 100000 || { echo "壳 dex 体积异常：$DEX_SIZE"; exit 1; }

          # 2) 资源混淆已生效（短路径）
          grep -qE "res/[A-Za-z]{2}$" "$RUNNER_TEMP/apk-listing.txt"

          # 3) 签名与对齐：证书必须与 H1 期望一致，否则装上也活不过 1.2s
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/zipalign" -c -p 4 "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: release-apk-${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/release/app-release-shell.apk
          retention-days: 90
          if-no-files-found: error

      # R8 mapping 必须与 APK 同版本归档：线上崩溃栈只有配合它才能还原。
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v6
        with:
          name: r8-mapping-${{ steps.version.outputs.name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: error

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-build-reports
          path: |
            **/build/reports/
          if-no-files-found: ignore

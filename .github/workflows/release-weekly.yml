name: Weekly Release Build

# 目的：持续验证 release 打包链路（R8 收缩、资源收缩、native、签名），
# 避免长期不构建导致升级 AGP/R8 后才暴露问题。
# 单测与 lint 由 ci.yml 负责，这里只证明"能出可安装的 release 包 + 有 mapping"。

on:
  schedule:
    # 每周一 04:00（北京时间）执行；UTC 20:00 周日
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-weekly
  cancel-in-progress: true

jobs:
  release:
    # 与 ci.yml / instrumented-tests.yml 保持一致：固定镜像，避免标签迁移带来的环境漂移。
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # 仓库内的 keystore.properties / keystore.key 为测试专用签名，已入库（有意为之）。
      - name: Resolve version name
        id: version
        run: echo "name=$(grep -E '^versionName=' config.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # 加固开关必须在这里显式打开：默认关闭是为了不影响本地调试构建，
      # 但发布产物必须带上字符串加密（H2）与资源混淆（H4）。
      - name: Assemble release APK (hardened)
        run: ./gradlew :app:assembleRelease -PenableStringFog=true -PenableResObf=true --stacktrace

      # 资源混淆产物是**重新签名**的（aapt2 optimize 之后必须重签），
      # 这里校验签名有效且证书与 H1 期望一致，避免发布一个装不上的包。
      - name: Verify hardened APK signature
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release-resobf.apk
          test -f "$APK"
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/zipalign" -c -p 4 "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: release-apk-${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/release/app-release-resobf.apk
          retention-days: 90
          if-no-files-found: error

      # R8 mapping 必须与 APK 同版本归档：线上崩溃栈只有配合它才能还原。
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v6
        with:
          name: r8-mapping-${{ steps.version.outputs.name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: error

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-build-reports
          path: |
            **/build/reports/
          if-no-files-found: ignore

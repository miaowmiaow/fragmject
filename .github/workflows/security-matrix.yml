name: Security Shell Matrix

# 壳包的多版本回归：同一份代码在 Android 8 / 9 / 12 / 14 的 x86_64 模拟器上各跑一次，
# 断言「壳链路 + 安全库 + 不误杀」都成立。
#
# 为什么在 CI 而不是本地：开发机是 Apple Silicon，只能跑 arm64 镜像；
# 而 GitHub runner 是 x86_64，只能用 x86_64 镜像。两边互补：
# - 本地：arm64（贴近真机 ABI）
# - CI  ：x86_64 + 4 个 API 级别（覆盖系统版本差异）
on:
  workflow_dispatch:
  schedule:
    # 每周二 03:00 UTC，与周一的 release 出包错开
    - cron: '0 3 * * 2'

concurrency:
  group: security-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-matrix:
    name: shell @ API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 26 = 库的 minSdk（InMemoryDexClassLoader 下限）
        # 28 = hidden API 灰名单开始收紧
        # 31 = 黑名单进一步收紧
        # 34 = 现代基线
        api-level: [26, 28, 31, 34]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # compileSdk=37 对应的平台包在 SDK 仓库里是预览命名（本地实测为 android-37.0），
      # runner 上默认镜像不一定带。这里容错预装，缺失时交给 AGP 自动下载。
      - name: Pre-install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-37"    "build-tools;36.0.0" >/dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms" | tail -3

      # GitHub 的 Linux runner 默认拿不到 /dev/kvm，不放开会让模拟器退化成纯软件模拟：
      # 实测 4 个 API 级别的 job 全部 "Timeout waiting for emulator to boot"（10 分钟起不来）。
      # 与 instrumented-tests 用同一段脚本，保持两条模拟器链路一致。
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 只出 x86_64：默认产物仍是 arm64-v8a，矩阵构建用 -PmatrixAbi 覆盖
      #
      # 必须带 -PenableStringFog=true：本 workflow 是唯一「真的装包并启动」的 release 链路。
      # 字符串插桩改的是字节码，坏掉的表现是运行时 verify error / 崩溃，
      # release-weekly 那套结构+签名检查完全看不见；只在这里构建才可能被抓到。
      - name: Assemble x86_64 shell APK
        run: |
          ./gradlew :app:assembleRelease \
            -PenableDexShell=true \
            -PenableStringFog=true \
            -PmatrixAbi=x86_64 \
            -PenablePltCheck=true \
            --stacktrace

      - name: Smoke test on emulator
        # 钉在 v2 指向的提交而不是最新 release v2.9.0：2026-11-22 的定时回归在 v2.9.0 上失败，
        # 而此前用浮动 v2 的运行连续成功。升级前先手动 workflow_dispatch 跑一次验证。
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          # 与本地完全相同的断言脚本（装包/启动/校验结构/断言日志/断言存活）
          script: ./scripts/verify-shell-apk.sh

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: shell-matrix-api${{ matrix.api-level }}-logs
          path: build/verify-logs/
          retention-days: 14
          if-no-files-found: ignore

# Compose Compiler Stability Configuration
# 标记在 core:model / core:ui 中定义、被 Compose 可见且为不可变的数据类为稳定类型。
# 这些类无法添加 @Immutable 注解（core:model 模块不依赖 Compose runtime），
# 因此通过编译器稳定性配置文件告知 Compose Compiler 信任这些类为稳定的。
#
# 维护规则（务必遵守）：
# 1. 仅收录「所有字段均为 val 且字段类型不可变」的数据类。
# 2. 含 var 可变字段或 MutableList/MutableSet 等可变集合的类【不要】收录，
#    否则会导致重组被跳过、UI 不更新。已排除示例：
#    - Coin（open class + var username）
#    - MyCoin（继承 Coin，间接持有 var username）
#    - Tree（var childrenSelectPosition）
#    - Navigation（MutableList<Article>）
# 3. 新增 core/model 数据类后，必须同步追加到本清单，否则该类会被视为不稳定、造成静默性能退化。
# 4. 删除/重命名数据类后，必须同步移除本清单对应行，否则产生幽灵类。

# —— core/model（网络/持久层领域 DTO，全部不可变）——
com.example.fragmject.core.model.Article
com.example.fragmject.core.model.ArticleData
com.example.fragmject.core.model.ArticleTag
com.example.fragmject.core.model.Banner

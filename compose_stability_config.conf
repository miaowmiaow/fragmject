# Compose Compiler Stability Configuration
# 标记在 core:model 中定义但 Compose 可见的不可变数据类为稳定类型。
# 这些类无法添加 @Immutable 注解（core:model 模块不依赖 Compose runtime），
# 因此通过编译器稳定性配置文件告知 Compose Compiler 信任这些类为稳定的。
#
# Article — 项目最高频传递的 Composable 参数，List 字段来自网络响应，实例不可变
com.example.fragmject.core.model.Article
com.example.fragmject.core.model.ArticleTag
com.example.fragmject.core.model.Banner
com.example.fragmject.core.model.BannerList

# detekt 规则配置。
#
# 策略与 lint 一致：不做"每模块一份基线"，优先用低噪音规则集 + 少量有意关闭，
# 让 `./gradlew detekt` 在存量代码上可执行、新增问题可暴露。
# 默认规则集通过 buildUponDefaultConfig = true 继承，这里只覆盖差异项。
build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
    ignoreDefaultParameters: true
  TooManyFunctions:
    thresholdInFiles: 50
    thresholdInClasses: 50
    thresholdInInterfaces: 50
    thresholdInObjects: 50
    thresholdInEnums: 50

naming:
  # Compose 组合函数按约定首字母大写，与 Kotlin 函数命名规则冲突，属规则误报
  FunctionNaming:
    active: false

exceptions:
  # 本工程把「Android 框架边界统一兜底 + 日志 + 降级」作为明确架构约定：
  # ContentResolver / MediaStore / WebView / CookieManager / Room / 文件 IO 在不同 ROM
  # 与系统版本上抛出的异常类型并不统一（IO 异常与未检运行时异常混杂），收窄类型
  # 只会让本应降级的失败穿透崩溃，无法带来实际收益。实测把 24 处收窄到具体类型后，
  # detekt 仍把 RuntimeException / NPE 判为过宽，只有 6 处能真正收敛。
  # 真正保护质量的是 SwallowedException（禁止吞掉异常不记录），该规则保持开启。
  TooGenericExceptionCaught:
    active: false

style:
  # Compose 里数值密集（尺寸/权重/动画时长），强制常量只会降低可读性
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
    excludeCommentStatements: true
  # 守卫式早返回是本工程通用写法，强制"单出口"反而降低可读性
  ReturnCount:
    active: false
  # 行尾换行属格式化工具职责，不适合作为静态分析阻断项
  NewLineAtEndOfFile:
    active: false

# ============================================================================
# 版本策略（升级前先读这里）
#
# 1. 本工程刻意跟随前沿版本，但**联动升级**必须同一次提交完成：
#    AGP / Kotlin / KSP / Compose Compiler 之间存在编译期强绑定，
#    单独抬其中一个会得到难以定位的 KSP 或 Compose 编译器错误。
# 2. 每次升级按三步验证，缺一步不算完成：
#    ./gradlew testDebugUnitTest        # 单测 + 27 条架构规则
#    ./gradlew assembleDebug            # 资源合并 / NDK / 签名链路
#    真机冒烟：登录、列表分页、WebView、扫码、图片编辑、安全检测
# 3. 不要为了"最新"而升级；有明确收益（修复、性能、API 需求）才动版本。
# 4. 升级 PR 描述里附上三步验证结论，便于回溯是哪次升级引入了问题。
# ============================================================================

